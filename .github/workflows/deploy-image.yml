name: Desplegar en Dockerhub

on:
  push:
    tags:
      - "*.*.*-*"

jobs:
  deploy:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest

    steps: 
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Iniciar sesion en dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compilar y subir imagen
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: /
            ${{ secrets.DOCKER_USERNAME }}/weschler_frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/weschler_frontend:${{ github.ref_name }}